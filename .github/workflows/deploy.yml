name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Guard: only run from the real repo, not forks
    if: github.repository == 'ashcel/market-pulse'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: bun run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/code/personal/market-pulse
            git pull origin main

            # Backend (FastAPI + arq worker): deps, then Alembic owns the schema.
            export PATH="$HOME/.local/bin:$PATH"
            cd backend
            uv sync --frozen
            uv run alembic upgrade head

            # Frontend (TanStack web on 3002).
            export PATH="$HOME/.bun/bin:$PATH"
            cd ../frontend
            bun install
            bun run build

            # Restart the live units. The retired TS worker
            # (market-pulse-worker) stays disabled and its unit + source were
            # removed from the repo — it would write dead 1.0.0 records
            # (Phase 4 cutover, 2026-07-17).
            sudo systemctl restart market-pulse-api
            sudo systemctl restart market-pulse-arq
            sudo systemctl restart market-pulse
            echo "Deployed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
