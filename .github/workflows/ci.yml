name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  python:
    name: Engine + Backend (ruff/mypy/pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Engine checks
        working-directory: engine
        run: |
          uv sync
          uv run ruff check .
          uv run mypy smc tests
          uv run pytest -q

      - name: Backend checks
        working-directory: backend
        run: |
          uv sync
          uv run ruff check .
          uv run mypy app tests
          uv run pytest -q
