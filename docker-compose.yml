# Local + VPS Postgres for the forward-test system of record (Phase B).
# The web app and worker connect via DATABASE_URL (see .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: market-pulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Only applied on first init of the data volume. Set POSTGRES_PASSWORD in
      # an untracked .env next to this file (see .env.example); rotate an
      # existing volume's password with ALTER USER, not here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: market_pulse
    ports:
      # Loopback only — the record must never be reachable from the internet.
      - "127.0.0.1:5435:5432"
    volumes:
      - market_pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_pulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Job queue for the Python arq worker (migration Phase 0+). Host port 6380
    # because 6379 is occupied by an unrelated project's Redis on this VPS.
    image: redis:7-alpine
    container_name: market-pulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback only — same rule as the DB.
      - "127.0.0.1:6380:6379"
    volumes:
      - market_pulse_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  market_pulse_pgdata:
    # Pin the exact volume name. Without this, each compose flavor prefixes its
    # own project name (docker-compose v1 vs docker compose v2 differ), and a
    # recreate can silently attach a FRESH volume — which is precisely how the
    # forward-test record got orphaned on 2026-07-12. The record lives here;
    # never let the volume name float.
    name: market_pulse_pgdata
  market_pulse_redis:
    # Same pinning rationale as pgdata.
    name: market_pulse_redis
